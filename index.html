<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>MediaPipe Pose – Video to JSON</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>MediaPipe Pose Detection Tool</h1>

        <div class="controls">
            <label>
                <span>Select video: </span>
                <input id="videoFile" type="file" accept="video/*" />
            </label>

            <button id="videoDetectBtn" disabled>Detect from Video</button>
            <button id="frameDetectBtn" disabled>Detect from Frames</button>
            <label id="intervalLabel" style="display:none;">
                Interval (seconds): <input id="intervalInput" type="number" min="1" value="1" />
            </label>
            <button id="stopBtn" disabled>Stop</button>
            <button id="downloadBtn" disabled>Download JSON</button>

            <span id="status">Loading pose model…</span>
        </div>

        <div id="videoCropContainer" style="position:relative; display:inline-block; max-width:65%;">
            <video id="video" controls style="max-width:100%;"></video>
            <canvas id="overlay"></canvas>
            <div id="cropBox" class="crop-box" style="position:absolute;" hidden>
                <div class="resize-handle" data-corner="nw"></div>
                <div class="resize-handle" data-corner="ne"></div>
                <div class="resize-handle" data-corner="sw"></div>
                <div class="resize-handle" data-corner="se"></div>
            </div>
        </div>

        <div id="frameNav" style="display:none; margin-top:1rem;">
            <button id="prevFrameBtn">Previous</button>
            <span id="frameCounter"></span>
            <button id="nextFrameBtn">Next</button>
        </div>
        <script type="module" src="main.js"></script>
    </body>
</html>
