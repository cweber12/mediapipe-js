<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>MediaPipe Pose – Video to JSON</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>MediaPipe Pose Detection Tool</h1>

        <div class="controls">
            <label>
            <span>Select video: </span>
            <input id="videoFile" type="file" accept="video/*" />
            </label>

            <button id="startBtn" disabled>Start Pose Detection</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="downloadBtn" disabled>Download JSON</button>

            <span id="status">Loading pose model…</span>
        </div>

        <div class="video-container">
            <video id="video" controls></video>
            <canvas id="overlay"></canvas>
        </div>
        <script type="module" src="pose_landmarker.js"></script>
    </body>
</html>
