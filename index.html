<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>MediaPipe Pose – Video to JSON</title>

    <!-- MediaPipe Tasks Vision bundle will be imported as ES module below -->

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 1.5rem;
            background: #111;
            color: #eee;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .controls {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: #2c7be5;
            color: white;
            font-weight: 500;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        input[type="file"] {
            color: #eee;
        }

        #status {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .video-container {
            position: relative;
            display: inline-block;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        video {
            display: block;
            max-width: 100%;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
  <h1>MediaPipe Pose on Video (JS) → JSON Export</h1>

  <div class="controls">
    <label>
      <span>Select video: </span>
      <input id="videoFile" type="file" accept="video/*" />
    </label>

    <button id="startBtn" disabled>Start Pose Detection</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="downloadBtn" disabled>Download JSON</button>

    <span id="status">Loading pose model…</span>
  </div>

  <div class="video-container">
    <video id="video" controls></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    // ...existing code...
  </script>
  <script type="module">
    import {
      FilesetResolver,
      PoseLandmarker,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

    const videoFileInput = document.getElementById('videoFile');
    const videoEl        = document.getElementById('video');
    const canvasEl       = document.getElementById('overlay');
    const startBtn       = document.getElementById('startBtn');
    const stopBtn        = document.getElementById('stopBtn');
    const downloadBtn    = document.getElementById('downloadBtn');
    const statusEl       = document.getElementById('status');

    let poseLandmarker = null;
    let drawingUtils   = null;
    let canvasCtx      = null;

    let running = false;
    let lastVideoTime = -1;

    // Collected results: one entry per processed frame
    const poseResults = [];

    // Load the pose model
    async function initPoseLandmarker() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          // WASM path
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            // You can switch to full / heavy if you want higher accuracy
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1,
          minPoseDetectionConfidence: 0.5,
          minPosePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
          outputSegmentationMasks: false
        });

        canvasCtx    = canvasEl.getContext('2d');
        drawingUtils = new DrawingUtils(canvasCtx);

        statusEl.textContent = "Model loaded. Choose a video file to begin.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error loading pose model. Check console.";
      }
    }

    initPoseLandmarker();

    // When a video file is selected
    videoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      videoEl.src = url;

      // Reset previous results
      poseResults.length = 0;
      downloadBtn.disabled = true;

      statusEl.textContent = "Video loaded. Press 'Start Pose Detection'.";
      startBtn.disabled = false;
    });

    // Sync canvas to video size once metadata is available
    videoEl.addEventListener('loadedmetadata', () => {
      canvasEl.width  = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
    });

    startBtn.addEventListener('click', () => {
      if (!poseLandmarker) {
        alert("Pose model not ready yet.");
        return;
      }
      if (!videoEl.src) {
        alert("Please select a video first.");
        return;
      }

      running = true;
      lastVideoTime = -1;
      poseResults.length = 0; // clear old data

      startBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.disabled = true;

      statusEl.textContent = "Running pose detection… (this may be slow for long videos)";
      // Ensure playback starts
      videoEl.play();
      requestAnimationFrame(processVideoFrame);
    });

    stopBtn.addEventListener('click', () => {
      running = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      downloadBtn.disabled = poseResults.length === 0;

      statusEl.textContent = "Stopped. You can download JSON or start again.";
    });

    function processVideoFrame() {
      if (!running || !poseLandmarker) return;

      // If video ended, stop
      if (videoEl.ended || videoEl.currentTime >= videoEl.duration) {
        running = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        downloadBtn.disabled = poseResults.length === 0;
        statusEl.textContent = "Finished processing video.";
        return;
      }

      const now = performance.now();

      // Only process when the video's currentTime advanced
      if (videoEl.currentTime !== lastVideoTime) {
        lastVideoTime = videoEl.currentTime;

        poseLandmarker.detectForVideo(videoEl, now, (result) => {
          // Clear overlay
          canvasCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);

          if (result && result.landmarks && result.landmarks.length > 0) {
            const frameWidth  = videoEl.videoWidth;
            const frameHeight = videoEl.videoHeight;

            // Draw landmarks on canvas overlay
            for (const landmarkSet of result.landmarks) {
              drawingUtils.drawLandmarks(landmarkSet, {
                radius: (data) => DrawingUtils.lerp(data.from.z, -0.15, 0.1, 5, 1)
              });
              drawingUtils.drawConnectors(
                landmarkSet,
                PoseLandmarker.POSE_CONNECTIONS
              );

              // Convert normalized coords (0–1) to pixel coords and store
              const pixels = landmarkSet.map((lm, index) => ({
                index,
                x_norm: lm.x,
                y_norm: lm.y,
                x_px: lm.x * frameWidth,
                y_px: lm.y * frameHeight,
                z: lm.z,
                visibility: lm.visibility
              }));

              poseResults.push({
                timeSec: videoEl.currentTime,
                frameWidth,
                frameHeight,
                landmarks: pixels
              });
            }
          }
        });
      }

      // Continue loop
      requestAnimationFrame(processVideoFrame);
    }

    downloadBtn.addEventListener('click', () => {
      if (poseResults.length === 0) {
        alert("No pose data collected yet.");
        return;
      }

      const blob = new Blob(
        [JSON.stringify(poseResults, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "pose_landmarks.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      if (poseLandmarker) {
        poseLandmarker.close();
      }
    });
  </script>
</body>
</html>
